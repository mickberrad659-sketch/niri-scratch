[package]
name = "niri-scratch"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reliable named-workspace scratchpads for niri"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
niri-ipc = "=26.4.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

