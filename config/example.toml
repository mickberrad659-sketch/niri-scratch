[daemon]
launch_timeout_ms = 8000

[scratchpads.web]
workspace = "scratch:web"
command = ["firefox", "--new-window"]
match_app_id = "^firefox$"
adopt_existing = false

[scratchpads.d]
workspace = "scratch:d"
launch_if_missing = false

[scratchpads.f]
workspace = "scratch:f"
launch_if_missing = false

[scratchpads.chat]
workspace = "scratch:chat"
commands = [["Telegram"], ["throne"]]
match_app_id = "^(org\\.telegram\\.desktop|Throne)$"
initial_focus_app_id = "^org\\.telegram\\.desktop$"
initial_focus_full_width = true

[scratchpads.u]
workspace = "scratch:u"
launch_if_missing = false
